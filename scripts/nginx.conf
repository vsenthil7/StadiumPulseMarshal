worker_processes 1;
events { worker_connections 1024; }

http {
  # Round-robin across both replicas so consecutive requests hit different
  # instances — the point of the multi-instance verification.
  upstream app_pool {
    server app1:8080;
    server app2:8080;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_pool;
      proxy_set_header Host $host;
      # Preserve the real client IP so the auth limiter keys per real client,
      # not per proxy hop.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      # Surface which upstream served the request for the verifier.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
