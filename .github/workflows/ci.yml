name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest + coverage
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      USE_MOCKS: "true"
      REDIS_URL: "redis://localhost:6379/0"
      DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install deps
        run: |
          pip install -e ".[dev,agent]" || pip install -e .
          pip install "redis>=5" "fakeredis>=2" alembic
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -q

  frontend:
    name: Frontend — tsc + vite build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Start stack
        run: |
          docker compose up --build -d
          timeout 60 bash -c 'until curl -sf http://localhost:8088/api/v1/health; do sleep 2; done'
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright
        run: cd frontend && npx playwright test --reporter=list
        env:
          BASE_URL: "http://localhost:8088"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Tear down
        if: always()
        run: docker compose down -v

  container:
    name: Container — docker build
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stadiumpulse-marshal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
