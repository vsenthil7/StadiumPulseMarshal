# Cloud Run service descriptor. Deploy with:
#   gcloud run services replace cloudrun.yaml --region=europe-west2
# Secrets are bound from Secret Manager (no plaintext secrets in env).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stadiumpulse-marshal
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containers:
        # Image is substituted at deploy time (envsubst ${IMAGE} or gcloud deploy):
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: USE_MOCKS
              value: "false"
            - name: GOOGLE_CLOUD_LOCATION
              value: "europe-west2"
            - name: GEMINI_MODEL
              value: "gemini-2.0-flash"
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////data/spm.db"
            # --- Secret Manager bindings (no plaintext secrets) ---
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: DT_API_TOKEN
                  key: latest
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_API_KEY
                  key: latest
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
                secretKeyRef:
                  name: PAGERDUTY_ROUTING_KEY
                  key: latest
            - name: OPSGENIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: OPSGENIE_API_KEY
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 15
