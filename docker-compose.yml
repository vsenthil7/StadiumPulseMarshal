# Multi-instance deployment: Redis-backed shared state + two app replicas behind
# an nginx load balancer. Proves the Round 10 shared backends end-to-end —
# the auth rate limiter and any shared counters are global across replicas
# because both replicas point at the same REDIS_URL.
#
#   docker compose up --build
#   ./scripts/verify_multi_instance.sh   # asserts the shared limit holds across both
#
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      - POSTGRES_USER=spm
      - POSTGRES_PASSWORD=spm
      - POSTGRES_DB=spm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spm"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - spm-pg:/var/lib/postgresql/data

  app1:
    build:
      context: .
    environment:
      - USE_MOCKS=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////data/spm.db
      - AUTH_RATE_LIMIT_PER_MINUTE=5
      - SECURITY_HEADERS_ENABLED=true
      - INSTANCE_ID=app1
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - spm-data:/data

  app2:
    build:
      context: .
    environment:
      - USE_MOCKS=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:////data/spm.db
      - AUTH_RATE_LIMIT_PER_MINUTE=5
      - SECURITY_HEADERS_ENABLED=true
      - INSTANCE_ID=app2
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - spm-data:/data

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

# Named volume backing the SQLite ack/silence DB shared by both replicas.
# Note: SQLite suits durability-across-restarts in this demo; for true
# multi-writer concurrency use Postgres (set DATABASE_URL accordingly).
volumes:
  spm-data:
  spm-pg:
